{% extends "base.html" %}

{% block content %}
<h2>Farm Map</h2>
<div id="map" style="height: 500px;"></div>

<script>
  // 示例：Leaflet.js 地图初始化
  var map = L.map('map').setView([51.505, -0.09], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
</script>
{% endblock %}
