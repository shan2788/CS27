{% extends 'base.html' %}
{% block webpageContent %}
{% load static %}
<link rel="stylesheet" href="{% static 'map/css/map.css' %}">


<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>
</div>

<!-- Page Content -->
<div class="container" style="max-width: 100%;" xmlns="http://www.w3.org/1999/html">
    <!-- Header -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h4 class="card-title">Farm Map <span class="text-muted fw-normal ms-2"></span></h4>
        </div>
    </div>

    <!-- Date Selection -->
    <div class="row mb-3">
        <div class="col-md-3">
            <label>Start Date:</label>
            <input type="date" id="start-date" class="form-control" value="2024-11-23">
        </div>
        <div class="col-md-3">
            <label>End Date:</label>
            <input type="date" id="end-date" class="form-control" value="2024-12-23">
        </div>
    </div>

    <!-- Map Section -->
    <div class="row">
        <div class="col-12">
            <div id="map" style="height: 500px; border: 1px solid #ccc; border-radius: 8px;"></div>
        </div>
    </div>
    <div class="mt-3">
        <button id="start-draw" class="btn btn-primary">Start Drawing</button>
        <button id="end-draw" class="btn btn-secondary">Cancel Drawing</button>
        <button class="btn btn-success" onclick="debounceSubmitPolygon()">Get NDVI</button>
        <button id="tree-recommendation-btn" class="btn btn-success">Tree Recommendation</button>


        <button id="save-ndvi-btn" class="btn btn-success">💾 Save NDVI Region</button>
        <div class="btn-group">
          <div class="dropdown">
            <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              📄 Generate Report
            </button>
            <ul class="dropdown-menu">
              <li><button id="generate-report-btn" class="btn btn-info">📄 NDVI Report</button></li>
              <li><button id="carbon-credit-btn" class="btn btn-info">📄 Carbon Credit Report</button></li>
            </ul>
          </div>
          <div class="dropdown">
            <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              📜 View History
            </button>
            <ul class="dropdown-menu">
              <button id="view-history-btn" class="btn btn-info">📜 View Region History</button>
              <a href="{% url 'report_history' request.user.currentFarm.id %}" class="btn btn-info">📜 View NDVI Report History</a>
              <a href="{% url 'carbon_credit_history' request.user.currentFarm.id %}" class="btn btn-info">📜 View Carbon Credit History</a>
            </ul>
          </div>
        </div>
        <br>
        <div>
        </p>
        <button class="btn btn-warning" onclick="fetchMonthlyNDVI()">📆 Monthly NDVI Summary</button>

    </div>
    <div class="mb-3">
      <label for="draw-shape">Select Shape:</label>
      <select id="draw-shape" class="form-select" style="width: 200px;">
          <option value="polygon" selected>Polygon</option>
          <option value="rectangle">Rectangle</option>
          <option value="triangle">Triangle</option>
      </select>

    </div>

    <!--tree recommendation-->
    <div class="card mt-3">
      <div class="card-header">Recommendation Result</div>
      <div class="card-body" id="tree-recommendation-result">
        <p>Please select an area to get recommendation</p>
      </div>
    </div>


    <!-- NDVI Image Display -->
    <div class="row mt-4">
        <div class="col-12">
            <h5>NDVI Image</h5>
            <img id="ndvi-image" style="max-width: 100%; border: 1px solid #ccc;" />
        </div>
    </div>

    <div id="monthly-ndvi-container" class="row mt-4"></div>

    <div id="farm-details" 
        data-farm-id="{{ request.user.currentFarm.id }}"
        data-farm-name="{{ request.user.currentFarm.farm_name }}"
        data-farm-location="{{ request.user.currentFarm.farm_street }}, {{ request.user.currentFarm.farm_state }} {{ request.user.currentFarm.farm_postcode }}"
        style="display: none;">
    </div>




    <!-- History Section -->
    <div id="history-section" class="mt-4" style="display: none;">
      <h5>Region History</h5>
      <div id="history-content"></div>
    </div>

<!--    <div id="report-history-section" class="mt-4" style="display: none;">-->
<!--      <h5>Report History</h5>-->
<!--      <div id="report-history-content"></div>-->
<!--    </div>-->
</div>

<!-- Leaflet JS & CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>


<script>
  const csrfToken = "{{ csrf_token }}";
</script>
<script src="{% static 'map/js/map_init.js' %}"></script>
<script src="{% static 'map/js/draw_logic.js' %}"></script>
<script src="{% static 'map/js/loading.js' %}"></script>
<script src="{% static 'map/js/ndvi_request.js' %}"></script>
<script src="{% static 'map/js/report_generator.js' %}"></script>
<script src="{% static 'map/js/history_fetcher.js' %}"></script>


{% endblock %}
