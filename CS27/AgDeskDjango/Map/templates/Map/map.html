{% extends 'base.html' %}
{% block webpageContent %}
{% load static %}
<style>
#monthly-ndvi-container {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 1rem;
  padding-bottom: 10px;
}

/* Card 自适应大小 */
#monthly-ndvi-container .card {
  flex: 0 0 auto;
  width: auto; /* 👈 重点！不固定宽度了 */
  max-width: 90%; /* 可选：防止太大，留点边距 */
}

/* 图片按比例完整显示 */
#monthly-ndvi-container img {
  max-width: 100%;
  height: auto;
  max-height: 400px; /* 控制最大高度，看你需要，400px比较好 */
  object-fit: contain;
  display: block;
  margin: auto; /* 图片居中 */
}

/* 让卡片内容（文字）有一点padding */
#monthly-ndvi-container .card-body {
  padding: 10px;
}
</style>



<!-- Page Content -->
<div class="container" style="max-width: 100%;" xmlns="http://www.w3.org/1999/html">
    <!-- Header -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h4 class="card-title">Farm Map <span class="text-muted fw-normal ms-2"></span></h4>
        </div>
    </div>

    <!-- Date Selection -->
    <div class="row mb-3">
        <div class="col-md-3">
            <label>Start Date:</label>
            <input type="date" id="start-date" class="form-control" value="2024-11-23">
        </div>
        <div class="col-md-3">
            <label>End Date:</label>
            <input type="date" id="end-date" class="form-control" value="2024-12-23">
        </div>
    </div>

    <!-- Map Section -->
    <div class="row">
        <div class="col-12">
            <div id="map" style="height: 500px; border: 1px solid #ccc; border-radius: 8px;"></div>
        </div>
    </div>
    <div class="mt-3">
        <button id="start-draw" class="btn btn-primary">Start Drawing</button>
        <button id="end-draw" class="btn btn-secondary">Cancel Drawing</button>
        <button class="btn btn-success" onclick="debounceSubmitPolygon()">Get NDVI</button>
        <button class="btn btn-success" hx-post="{% url 'tree-recommendation' %}" hx-vals='js:{"geometry": selectedGeometry}' hx-target="#tree-recommendation-result" hx-target="#tree-recommendation-result" hx-swap="innerHTML">Tree Recommendation</button>
        <button id="save-ndvi-btn" class="btn btn-success">💾 Save NDVI Region</button>
        <button id="generate-report-btn" class="btn btn-info">📄 Generate Report</button>
        <button id="view-history-btn" class="btn btn-info">📜 View Region History</button>
        <a href="{% url 'report_history' request.user.currentFarm.id %}" class="btn btn-info">📜 View Report History</a>
        <br>
        <div>
          <button id="carbon-credit-btn" class="btn btn-info">📄 Carbon Credit Report</button>
          <a href="{% url 'carbon_credit_history' request.user.currentFarm.id %}" class="btn btn-info">📜 View Carbon Credit History</a>
        </p>
        <button class="btn btn-warning" onclick="fetchMonthlyNDVI()">📆 Monthly NDVI Summary</button>

    </div>
    <div class="mb-3">
      <label for="draw-shape">Select Shape:</label>
      <select id="draw-shape" class="form-select" style="width: 200px;">
          <option value="polygon" selected>Polygon</option>
          <option value="rectangle">Rectangle</option>
          <option value="triangle">Triangle</option>
      </select>

    </div>

    <!--tree recommendation-->
    <div class="card mt-3">
      <div class="card-header">Recommendation Result</div>
      <div class="card-body" id="tree-recommendation-result">
        <p>Please select an area to get recommendation</p>
      </div>
    </div>


    <!-- NDVI Image Display -->
    <div class="row mt-4">
        <div class="col-12">
            <h5>NDVI Image</h5>
            <img id="ndvi-image" style="max-width: 100%; border: 1px solid #ccc;" />
        </div>
    </div>

    <div id="monthly-ndvi-container" class="row mt-4"></div>






    <!-- History Section -->
    <div id="history-section" class="mt-4" style="display: none;">
      <h5>Region History</h5>
      <div id="history-content"></div>
    </div>

<!--    <div id="report-history-section" class="mt-4" style="display: none;">-->
<!--      <h5>Report History</h5>-->
<!--      <div id="report-history-content"></div>-->
<!--    </div>-->
</div>

<!-- Leaflet JS & CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script>
  let drawnPolygon = null;
  let drawHandler;
  const map = L.map('map').setView([-33.8688, 151.2093], 10);

  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let sentinelLayer = L.tileLayer.wms('https://services.sentinel-hub.com/ogc/wms/{{ sentinel_instance_id }}', {
    layers: '3_NDVI',
    format: 'image/png',
    transparent: true,
    SHOWLOGO: false,
    attribution: '&copy; Sentinel Hub',
    updateWhenIdle: true,
    reuseTiles: true
  });


  // Layer Control
  const baseMaps = {
    "OpenStreetMap": osmLayer
  };

  const overlayMaps = {
    "Sentinel-2 Imagery": sentinelLayer
  };

  L.control.layers(baseMaps, overlayMaps).addTo(map);

  const drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  drawHandler = new L.Draw.Polygon(map, {
    allowIntersection: false,
    showArea: true,
    drawError: {
      color: '#e1e100',
      message: '<strong>Error:</strong> shape invalid!'
    },
    shapeOptions: {
      color: '#97009c'
    }
  });

  map.on(L.Draw.Event.CREATED, function (event) {
    if (drawnPolygon) map.removeLayer(drawnPolygon);
    drawnPolygon = event.layer;
    drawnItems.addLayer(drawnPolygon);
  });

  function submitPolygon() {
    if (!drawnPolygon) {
      alert("Please draw a region first.");
      return;
    }
    const geojson = drawnPolygon.toGeoJSON();
    const startDate = document.getElementById("start-date").value;
    const endDate = document.getElementById("end-date").value;
    fetch("/map/api/ndvi/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({
        geometry: geojson.geometry,
        start_date: startDate,
        end_date: endDate
      })
    })
    .then(res => {
      if (!res.ok) throw new Error("Network response was not ok");
      return res.blob();
    })
    .then(blob => {
      const imageUrl = URL.createObjectURL(blob);
      document.getElementById("ndvi-image").src = imageUrl;
    })
    .catch(err => {
      alert("Error fetching NDVI image");
      console.error(err);
    });
  }

let debounceTimer = null;
function debounceSubmitPolygon() {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    submitPolygon();
  }, 300); // 300ms
}

  document.getElementById("save-ndvi-btn").addEventListener("click", function () {
    if (!drawnPolygon) {
        alert("Please draw a region first.");
        return;
    }

    const geojson = drawnPolygon.toGeoJSON();
    const startDate = document.getElementById("start-date").value;
    const endDate = document.getElementById("end-date").value;

    fetch("/map/api/save-ndvi/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            geometry: geojson.geometry,
            start_date: startDate,
            end_date: endDate
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Network response was not ok");
        return res.json();
    })
    .then(data => {
        if (data.status === "ok") {
            alert("NDVI region saved successfully! Region ID: " + data.id);
        } else {
            alert("Failed to save NDVI region.");
        }
    })
    .catch(err => {
        alert("Error saving NDVI region.");
        console.error(err);
    });
  });

  document.getElementById("generate-report-btn").addEventListener("click", function () {
    if (!drawnPolygon) {
        alert("Please draw a region first.");
        return;
    }

    const geojson = drawnPolygon.toGeoJSON();
    const startDate = document.getElementById("start-date").value;
    const endDate = document.getElementById("end-date").value;

    fetch("/map/api/generate-report/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            geometry: geojson.geometry,
            start_date: startDate,
            end_date: endDate
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Network response was not ok");
        return res.blob(); // Assuming the report is returned as a file (e.g., PDF)
    })
    .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = "NDVI_Report.pdf"; // Default file name
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        alert("Report downloaded successfully!");
    })
    .catch(err => {
        alert("Error generating report.");
        console.error(err);
    });
  });

  document.getElementById("carbon-credit-btn").addEventListener("click", function () {
    if (!drawnPolygon) {
        alert("Please draw a region first.");
        return;
    }

    const geojson = drawnPolygon.toGeoJSON();
    const startDate = document.getElementById("start-date").value;
    const endDate = document.getElementById("end-date").value;

    fetch("/map/api/carbon-credit/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            geometry: geojson.geometry,
            start_date: startDate,
            end_date: endDate
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Network response was not ok");
        return res.blob(); // Assuming the report is returned as a file (e.g., PDF)
    })
    .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = "Carbon_Credit.pdf"; // Default file name
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        alert("Carbon Credit Report downloaded successfully!");
    })
    .catch(err => {
        alert("Unable to calculate carbon credit report.");
        console.error(err);
    });
  });


  // const customDrawer = new L.Draw.Polygon(map, {
  //   allowIntersection: false,
  //   showArea: true,
  //   drawError: {
  //     color: '#e1e100',
  //     message: '<strong>Error:</strong> shape invalid!'
  //   },
  //   shapeOptions: {
  //     color: '#97009c',
  //     weight: 2,
  //     fillOpacity: 0.1
  //   }
  // });

  const polygonDrawer = new L.Draw.Polygon(map, {
    allowIntersection: false,
    showArea: true,
    shapeOptions: { color: '#97009c', fillOpacity: 0.1 }
  });

  const rectangleDrawer = new L.Draw.Rectangle(map, {
    shapeOptions: { color: '#ff7800', fillOpacity: 0.1 }
  });

L.Draw.Triangle = L.Draw.SimpleShape.extend({
  statics: {
    TYPE: 'triangle'
  },

  options: {
    shapeOptions: {
      stroke: true,
      color: '#007bff',
      weight: 2,
      opacity: 1,
      fill: true,
      fillColor: null, // same as color by default
      fillOpacity: 0.2,
      clickable: true
    }
  },

  initialize: function (map, options) {
    this.type = L.Draw.Triangle.TYPE;
    L.Draw.SimpleShape.prototype.initialize.call(this, map, options);
  },

  _drawShape: function (latlng) {
    if (!this._shape) {
      const triangleLatLngs = this._getTrianglePoints(this._startLatLng, latlng);
      this._shape = L.polygon(triangleLatLngs, this.options.shapeOptions);
      this._map.addLayer(this._shape);
    } else {
      const triangleLatLngs = this._getTrianglePoints(this._startLatLng, latlng);
      this._shape.setLatLngs(triangleLatLngs);
    }
  },

  _getTrianglePoints: function (startLatLng, endLatLng) {
  const latTop = startLatLng.lat;
  const lngLeft = startLatLng.lng;
  const latBottom = endLatLng.lat;
  const lngRight = endLatLng.lng;


  const topPoint = [latTop, lngLeft];
  const bottomLeft = [latBottom, lngLeft];
  const bottomRight = [latBottom, lngRight];
  return [topPoint, bottomRight, bottomLeft];
},

  _fireCreatedEvent: function () {
    const triangle = L.polygon(this._shape.getLatLngs(), this.options.shapeOptions);
    L.Draw.SimpleShape.prototype._fireCreatedEvent.call(this, triangle);
  }
});


  const triangleDrawer = new L.Draw.Triangle(map, {
    shapeOptions: { color: '#007bff', fillOpacity: 0.1 }
  });



  function disableAllDrawers() {
    polygonDrawer.disable();
    rectangleDrawer.disable();
    triangleDrawer.disable();
  }


  document.getElementById("start-draw").addEventListener("click", function () {
    const shape = document.getElementById("draw-shape").value;
    disableAllDrawers();

    if (shape === "polygon") polygonDrawer.enable();
    else if (shape === "rectangle") rectangleDrawer.enable();
    else if (shape === "triangle") triangleDrawer.enable();
  });

  document.getElementById("end-draw").addEventListener("click", function () {
    disableAllDrawers();
  });

  map.on(L.Draw.Event.CREATED, function (event) {
    if (drawnPolygon) {
      map.removeLayer(drawnPolygon);
    }

    drawnPolygon = event.layer;

    drawnPolygon.setStyle({
      fillColor: "#ffffff",
      fillOpacity: 0.1,
      color: "#ff0000",
      weight: 2
    });

    drawnPolygon.addTo(map);
  });

  document.getElementById("view-history-btn").addEventListener("click", function () {
    const historySection = document.getElementById("history-section");
    const historyContent = document.getElementById("history-content");

    // Replace with the actual farm ID
    const farmId = "{{ request.user.currentFarm.id }}";

    // Toggle visibility
    if (historySection.style.display === "none") {
        historySection.style.display = "block";

        // Fetch history content
        fetch(`/map/api/region-history/${farmId}/`)
            .then(res => {
                if (!res.ok) throw new Error("Failed to load history.");
                return res.text();
            })
            .then(html => {
                historyContent.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                historyContent.innerHTML = "<p>Error loading history.</p>";
            });
    } else {
        historySection.style.display = "none";
    }
  });

  document.getElementById("view-report-history-btn").addEventListener("click", function () {
    const reportHistorySection = document.getElementById("report-history-section");
    const reportHistoryContent = document.getElementById("report-history-content");

    // Replace with the actual farm ID
    const farmId = "{{ request.user.currentFarm.id }}";

    // Toggle visibility
    if (reportHistorySection.style.display === "none") {
        reportHistorySection.style.display = "block";

        // Fetch report history content
        fetch(`/map/api/report-history/${farmId}/`)
            .then(res => {
                if (!res.ok) throw new Error("Failed to load report history.");
                return res.text();
            })
            .then(html => {
                reportHistoryContent.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                reportHistoryContent.innerHTML = "<p>Error loading report history.</p>";
            });
    } else {
        reportHistorySection.style.display = "none";
    }
  });
  function fetchMonthlyNDVI() {
  if (!drawnPolygon) {
    alert("Please draw a region.");
    return;
  }

  const geojson = drawnPolygon.toGeoJSON();
  const startDate = document.getElementById("start-date").value;
  const endDate = document.getElementById("end-date").value;

  fetch("/map/api/ndvi-monthly/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({
      geometry: geojson.geometry,
      start_date: startDate,
      end_date: endDate
    })
  })
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("monthly-ndvi-container");
      container.innerHTML = "";
      data.forEach(item => {
        const card = `
          <div class="card mb-3">
            <div class="card-header">${item.month}</div>
            <img src="data:image/png;base64,${item.image_base64}" class="card-img-top" />
            <div class="card-body">
              <p><strong>Mean NDVI:</strong> ${item.ndvi_mean}</p>
              <p><strong>Max NDVI:</strong> ${item.ndvi_max}</p>
              <p><strong>Min NDVI:</strong> ${item.ndvi_min}</p>
            </div>
          </div>`;
        container.insertAdjacentHTML("beforeend", card);
      });
    })
    .catch(err => {
      console.error("Error:", err);
      alert("Failed to fetch monthly NDVI summary.");
    });
}


  document.getElementById("view-carbon-credit-history-btn").addEventListener("click", function () {
    const reportHistorySection = document.getElementById("carbon-credit-history-section");
    const reportHistoryContent = document.getElementById("carbon-credit-history-content");

    // Replace with the actual farm ID
    const farmId = "{{ request.user.currentFarm.id }}";

    // Toggle visibility
    if (reportHistorySection.style.display === "none") {
        reportHistorySection.style.display = "block";

        // Fetch report history content
        fetch(`/map/api/carbon-credit-history/${farmId}/`)
            .then(res => {
                if (!res.ok) throw new Error("Failed to load carbon credit history.");
                return res.text();
            })
            .then(html => {
                reportHistoryContent.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                reportHistoryContent.innerHTML = "<p>Error loading carbon credit history.</p>";
            });
    } else {
        reportHistorySection.style.display = "none";
    }
  });


</script>

{% endblock %}
